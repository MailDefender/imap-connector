name: CI Build

on:
  push:
  pull_request:
    branches:
      - "main"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # Image name (ex: ghcr.io/<ton-org>/<ton-repo>)

jobs:
  test:
    name: Runs unit tests
    runs-on: ubuntu-latest
    env:
      IMAP_HOST: localhost
      IMAP_PORT: 31143
      IMAP_TLS: false
      IMAP_USERNAME: test
      IMAP_PASSWORD: test
    steps:
      - name: Cleanup
        run: sudo rm -rf *

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y netcat-traditional podman

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Get dependencies
        run: go mod download

      - name: Fetch dovecot image
        run: podman pull dovecot/dovecot:2.4.3

      - name: Start dovecot
        run: |
          cd mock
          sudo chown -R 1000:1000 emails
          sudo chmod -R 777 emails
          podman run -p 31143:31143 --name dovemock -v ./conf:/etc/dovecot/ -v ./emails:/srv/vmail/mail/ dovecot/dovecot:2.4.3 &

      - name: Check IMAP port
        run: lsof -i :31143
      - name: Unit tests
        run: go test -v ./...